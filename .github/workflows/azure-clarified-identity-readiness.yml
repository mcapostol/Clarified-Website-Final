name: Guarded CLARIFIED Azure identity readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarified-azure-identity-readiness
  cancel-in-progress: false

jobs:
  assert_clarified_identity:
    name: Assert locked CLARIFIED tenant and subscription
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AZURE_CORE_OUTPUT: none
      EXPECTED_AZURE_TENANT_ID: 4d03141f-9141-42e3-a03e-f823c4bbb29d
      EXPECTED_AZURE_SUBSCRIPTION_ID: bfed8e7d-30e2-463a-a639-24dc64977dbd
    steps:
      - name: Authenticate with the existing repository credential
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          environment: azurecloud
          allow-no-subscriptions: false

      - name: Fail closed unless the Azure context is CLARIFIED
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_tenant_id="$(az account show --only-show-errors --query tenantId --output tsv)"
          actual_subscription_id="$(az account show --only-show-errors --query id --output tsv)"
          actual_subscription_state="$(az account show --only-show-errors --query state --output tsv)"
          actual_cloud_name="$(az account show --only-show-errors --query environmentName --output tsv)"

          if [[ -z "$actual_tenant_id" || -z "$actual_subscription_id" ]]; then
            echo "::error::Azure account context is unavailable."
            exit 70
          fi
          if [[ "$actual_tenant_id" != "$EXPECTED_AZURE_TENANT_ID" ]]; then
            echo "::error::Azure tenant mismatch; refusing all further cloud operations."
            exit 71
          fi
          if [[ "$actual_subscription_id" != "$EXPECTED_AZURE_SUBSCRIPTION_ID" ]]; then
            echo "::error::Azure subscription mismatch; refusing all further cloud operations."
            exit 72
          fi
          if [[ "$actual_subscription_state" != "Enabled" || "$actual_cloud_name" != "AzureCloud" ]]; then
            echo "::error::The locked CLARIFIED Azure context is not enabled in AzureCloud."
            exit 73
          fi

          ACCOUNT_STATE="$actual_subscription_state" CLOUD_NAME="$actual_cloud_name" node <<'NODE'
          const fs = require("node:fs");

          const evidence = {
            contract_version: "clarified.azure-identity-readiness.v1",
            result: "PASS",
            tenant_id: process.env.EXPECTED_AZURE_TENANT_ID,
            subscription_id: process.env.EXPECTED_AZURE_SUBSCRIPTION_ID,
            environment: process.env.CLOUD_NAME,
            subscription_state: process.env.ACCOUNT_STATE,
            source_revision: process.env.GITHUB_SHA,
            authentication_performed: true,
            azure_mutations_performed: false,
            credential_material_emitted: false
          };
          fs.writeFileSync(
            "clarified-azure-identity-readiness.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
            { mode: 0o600 }
          );
          NODE

          echo "CLARIFIED Azure identity guard: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain safe readiness metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clarified-azure-identity-readiness-${{ github.run_id }}
          path: clarified-azure-identity-readiness.json
          if-no-files-found: error
          retention-days: 7
